# 전리품 상자가 뽑아 주는 "오늘 공부할 분야" 목록.
# - name : 카드에 크게 표시되는 분야 이름
# - from → to : 카드 배경 그라데이션 (categories.yml 의 색을 재사용)
# - sub  : (선택) 분야 이름 아래에 작게 보이는 한 줄 (예: 묶여 있는 세부 과목)
# - rarity : (선택) 등급을 고정합니다. common · rare · epic · legendary · transcendent
#            적지 않으면 상자를 열 때마다 확률로 정해집니다 (일반 55 · 희귀 30 · 영웅 12 · 전설 3).
# - weight : (선택) 뽑힐 비중. 기본 1. 작을수록 드물게 나옵니다.
# 항목을 추가하거나 지우면 상자에 바로 반영됩니다. (예시 목록입니다. 편하게 고쳐 주세요.)

- name: 웹 해킹
  from: "#d9531e"
  to: "#4d1a0a"

- name: 시스템 해킹
  from: "#1e6fd9"
  to: "#0a2a5c"

- name: 리버싱
  from: "#7a2fd0"
  to: "#2a1060"

- name: 암호학
  from: "#a02fd0"
  to: "#3a1050"

- name: 네트워크 보안
  from: "#1ea5d9"
  to: "#0a3a52"

- name: 취약점 분석·퍼징
  from: "#d99a1e"
  to: "#4d3408"

# 수학은 "초월" 등급으로 고정입니다. weight 가 작아서 전설보다도 드물게(약 50번에 한 번) 나옵니다.
# 더 자주 보고 싶으면 weight 를 키우세요. (1 이면 다른 분야와 같은 비중)
- name: 수학
  sub: 현대대수학 · 선형대수학 · 해석학 · 정수론
  from: "#4a33b8"
  to: "#0a0524"
  rarity: transcendent
  weight: 0.07
