# 카테고리의 순서와 설명.
# - name 은 글 front matter 의 categories 값과 정확히 같아야 합니다.
# - 글이 없는 카테고리도 0 으로 화면에 나타납니다. (링크는 없고, 글을 쓰면 자동으로 링크가 생기며 위로 올라갑니다)
# - 새 카테고리를 쓰려면 여기에 name 과 desc 를 먼저 추가하세요.
# - desc 는 Categories 페이지에 한 줄로 보입니다.

- name: 개발
  desc: 개발 환경과 도구, 구현 기록

- name: CTF/Wargame
  desc: 워게임과 CTF 풀이 기록

- name: Bug Bounty
  desc: 취약점 분석과 제보 기록

- name: 블로그/기술문서
  desc: 개념과 기술을 정리한 글

- name: 수학
  desc: 암호학에 필요한 수학을 공부하며 정리한 글

- name: 논문/컨퍼런스
  desc: 논문과 발표 자료를 읽고 정리한 글

- name: 공모전/자격증
  desc: 대회와 자격증 준비 기록
