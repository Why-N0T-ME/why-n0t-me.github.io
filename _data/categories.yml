# 카테고리의 순서와 설명.
# - name 은 글 front matter 의 categories 값과 정확히 같아야 합니다.
# - 글이 하나도 없는 카테고리는 화면에 나타나지 않습니다. (글을 쓰면 자동으로 나타납니다)
# - desc 는 Categories 페이지에 한 줄로 보입니다.

- name: 개발
  desc: 개발 환경과 도구, 구현 기록

- name: CTF/Wargame
  desc: 워게임과 CTF 풀이 기록

- name: Bug Bounty
  desc: 취약점 분석과 제보 기록

- name: 블로그/기술문서
  desc: 개념과 기술을 정리한 글

- name: 논문/컨퍼런스
  desc: 논문과 발표 자료를 읽고 정리한 글

- name: 공모전/자격증
  desc: 대회와 자격증 준비 기록
