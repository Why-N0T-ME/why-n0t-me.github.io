{%- assign gh = site.social.links | first -%}
<footer class="foot">
  <div class="wrap">
    <span>&copy; {{ site.time | date: '%Y' }} {{ site.social.name }}</span>
    <nav aria-label="바닥글 링크">
      {%- if gh -%}<a href="{{ gh }}" rel="noopener">GitHub</a>{%- endif -%}
      {%- if site.social.email -%}<a href="mailto:{{ site.social.email }}">Email</a>{%- endif -%}
    </nav>
  </div>
</footer>
