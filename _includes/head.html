<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a1226">

{% seo %}

<link rel="icon" type="image/png" href="{{ '/assets/img/favicon.png' | relative_url }}">
<link rel="apple-touch-icon" href="{{ '/assets/img/apple-touch-icon.png' | relative_url }}">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&amp;family=Rajdhani:wght@600;700&amp;display=swap">
<link rel="stylesheet" href="{{ '/assets/css/ow.css' | relative_url }}">

<script>
  /* 저장된 화면 모드를 페이지가 그려지기 전에 적용 (깜빡임 방지) */
  (function () {
    var t = 'dark';
    try {
      var s = localStorage.getItem('ow-theme');
      if (s === 'light' || s === 'dark') { t = s; }
    } catch (e) {}
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>

{%- if page.math -%}
<script>
  MathJax = {
    tex: {
      inlineMath: [['$', '$'], ['\\(', '\\)']],
      displayMath: [['$$', '$$'], ['\\[', '\\]']]
    }
  };
</script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-chtml.js"></script>
{%- endif -%}
