---
layout: default
---
<article class="ow-page-panel">
  {% if page.title %}
    <header class="ow-page-heading">
      <p class="ow-eyebrow"><span></span>{{ page.eyebrow | default: 'OPERATION FILE' }}</p>
      <h1>{{ page.title }}</h1>
      {% if page.description %}<p>{{ page.description }}</p>{% endif %}
    </header>
  {% endif %}
  <div class="ow-prose">
    {{ content }}
  </div>
</article>
