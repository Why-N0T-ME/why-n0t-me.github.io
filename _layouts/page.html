---
layout: default
---
<div class="ow-wrap">
  <header class="ow-pagehead">
    <h1 class="ow-pagetitle">{{ page.title | escape }}</h1>
    {%- if page.subtitle -%}
    <p class="ow-pagesub">{{ page.subtitle }}</p>
    {%- endif -%}
  </header>
  <div class="ow-panel ow-article ow-prose ow-typo">
    {{ content }}
  </div>
</div>
