<!doctype html>
<html lang="{{ site.lang | default: 'ko' }}" data-theme="dark">
<head>
  {% include head.html %}
</head>
<body class="{% if page.layout == 'home' %}is-home{% elsif page.layout == 'post' %}is-post{% endif %}">
  <a class="ow-skip" href="#ow-main">본문으로 건너뛰기</a>

  {% include header.html %}

  <main id="ow-main" class="ow-main">
    {{ content }}
  </main>

  {% include footer.html %}
  {% include loot.html %}

  <script>
    window.OW = {
      base: {{ site.baseurl | jsonify }},
      posts: {{ site.posts | map: 'url' | jsonify }},
      fields: {{ site.data.study_fields | jsonify }}
    };
  </script>
  <script src="{{ '/assets/js/ow.js' | relative_url }}" defer></script>
</body>
</html>
