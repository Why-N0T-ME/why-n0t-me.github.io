---
layout: default
---
<div class="wrap page-main">
  <header class="pagehead">
    <div class="crumbs"><a href="{{ '/tags/' | relative_url }}">Tags</a></div>
    <h1>{{ page.title | escape }}</h1>
    <p>{{ page.posts | size }}편</p>
  </header>

  <div class="rows rows--page">
    {%- for post in page.posts -%}
      {%- include post-row.html post=post -%}
    {%- endfor -%}
  </div>
</div>
