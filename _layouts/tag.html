---
layout: default
---
<div class="ow-wrap">
  <header class="ow-pagehead">
    <a class="ow-tag" href="{{ '/tags/' | relative_url }}">Tags</a>
    <h1 class="ow-pagetitle">#{{ page.title | escape }}</h1>
    <p class="ow-pagesub">글 {{ page.posts | size }}개</p>
  </header>

  <div class="ow-rows">
    {%- for post in page.posts -%}
      {%- include post-row.html post=post -%}
    {%- endfor -%}
  </div>
</div>
