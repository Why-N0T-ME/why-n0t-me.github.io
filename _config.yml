# Overwatch UI 블로그 설정
#
# 기존 _config.yml 에서 그대로 가져온 값: lang(→ko), timezone, title, tagline,
# description, url, baseurl, github, social, paginate, permalink, jekyll-archives
# 제거한 항목: Chirpy 전용 설정 (theme, analytics, pwa, comments, pageviews,
# assets.self_host, cdn, toc, theme_mode, collections.tabs, compress_html, sass)

lang: ko
timezone: Asia/Seoul

title: "Choi's Blog"
tagline: "Dreamhack, HackTheBox, TryHackMe Writeup / RFCs, references Review"
description: >-
  암호학, 보안 실습, CTF와 시스템 분석을 기록하는 Choi의 기술 블로그.

url: "https://why-n0t-me.github.io"
baseurl: ""

github:
  username: why-n0t-me

social:
  name: Choi
  email: wjofficialcs@gmail.com
  links:
    - https://github.com/why-n0t-me

# 프로필 사진 (원본 assets/img/avatar.png 는 2MB 라서 줄여 둔 파일을 씁니다)
avatar: /assets/img/profile.jpg
avatar_small: /assets/img/profile-sm.jpg

plugins:
  - jekyll-paginate
  - jekyll-archives
  - jekyll-seo-tag
  - jekyll-sitemap

# 전체 글(/blog/) 페이지네이션
paginate: 10
paginate_path: "/blog/page:num/"

# 글 주소는 기존과 동일하게 유지 (/posts/글제목/)
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      permalink: /posts/:title/

markdown: kramdown
kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/

exclude:
  - "*.gem"
  - "*.gemspec"
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - tools
  - node_modules
  - vendor
  # --- 이전 Chirpy / 이전 작업에서 남은 파일. 지워도 되고, 남겨 두어도 빌드에 영향이 없습니다.
  - _tabs
  - assets/css/jekyll-theme-chirpy.scss
  - assets/js/ow-menu.js
  - assets/lib
