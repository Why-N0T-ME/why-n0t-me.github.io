# 연구 노트형 블로그 설정
#
# 이 저장소는 gem 테마 없이 레이아웃·스타일을 직접 가지고 있습니다. (_layouts, _includes, assets)
# - 홈 문구: index.html 의 front matter
# - 홈 "Now" 카드: _data/now.yml        - 홈 "기록": _data/records.yml
# - 카테고리 순서·설명: _data/categories.yml
# - 홈의 대표 글: 글 front matter 에 featured: 1, 2, 3 (+ 짧은 소개 summary:)
# 이전 Overwatch 테마에서 쓰던 파일은 _archive/overwatch/ 에 보관했습니다. (빌드에는 쓰이지 않음)

lang: ko
timezone: Asia/Seoul

title: "Choi's Blog"
tagline: "Dreamhack, HackTheBox, TryHackMe Writeup / RFCs, references Review"
description: >-
  암호학, 보안 실습, CTF와 시스템 분석을 기록하는 Choi의 기술 블로그.

url: "https://why-n0t-me.github.io"
baseurl: ""

github:
  username: why-n0t-me

social:
  name: Choi
  email: wjofficialcs@gmail.com
  links:
    - https://github.com/why-n0t-me

# 프로필 사진 (원본 assets/img/site/avatar.png 는 2MB 라서 줄여 둔 파일을 씁니다)
avatar: /assets/img/site/profile.jpg
avatar_small: /assets/img/site/profile-sm.jpg

plugins:
  - jekyll-paginate
  - jekyll-archives
  - jekyll-seo-tag
  - jekyll-sitemap

# 전체 글(/blog/) 페이지네이션
paginate: 10
paginate_path: "/blog/page:num/"

# 글 주소는 기존과 동일하게 유지 (/posts/글제목/)
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      permalink: /posts/:title/

markdown: kramdown
kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/

exclude:
  - "*.gem"
  - "*.gemspec"
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - tools
  - node_modules
  - vendor
  # --- 이전 Chirpy / 이전 작업에서 남은 파일. 지워도 되고, 남겨 두어도 빌드에 영향이 없습니다.
  - _tabs
  - assets/css/jekyll-theme-chirpy.scss
  - assets/js/ow-menu.js
  - assets/lib
